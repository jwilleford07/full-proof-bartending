  <rect width="420" height="420" fill="none"/>
  <circle cx="210" cy="210" r="158" fill="none" stroke="#C8A46A" stroke-width="10"/>
  <circle cx="210" cy="210" r="132" fill="none" stroke="#EEE3CF" stroke-width="4"/>
  <circle cx="210" cy="210" r="178" fill="none" stroke="#B8793F" stroke-width="3" opacity="0.75"/>
  <text x="210" y="250"
