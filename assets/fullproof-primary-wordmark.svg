<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Full Proof Bartending primary wordmark</title>
  <desc id="desc">Primary all-caps Full Proof Bartending wordmark in warm ivory and champagne gold.</desc>
  <rect width="1200" height="320" fill="none"/>
  <text x="600" y="142"
    text-anchor="middle"
    fill="#EEE3CF"
    font-family="Playfair Display, Didot, Bodoni 72, Georgia, serif"
    font-size="128"
    font-weight="800"
    letter-spacing="3">
    FULL PROOF
  </text>
  <text x="600" y="226"
    text-anchor="middle"
    fill="#D3AE68"
    stroke="#050505"
    stroke-width="1.15"
    paint-order="stroke fill"
    font-family="Montserrat, Inter, Helvetica, Arial, sans-serif"
    font-size="31"
    font-weight="700"
    letter-spacing="22">
    BARTENDING
  </text>
</svg>
