<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" role="img" aria-labelledby="title desc">
  <title id="title">Full Proof Bartending stacked wordmark</title>
  <desc id="desc">Secondary stacked Full Proof Bartending wordmark for square or vertical applications.</desc>
  <rect width="850" height="520" fill="none"/>
  <text x="425" y="164"
    text-anchor="middle"
    fill="#EEE3CF"
    font-family="Playfair Display, Didot, Bodoni 72, Georgia, serif"
    font-size="136"
    font-weight="800"
    letter-spacing="4">
    FULL
  </text>
  <text x="425" y="300"
    text-anchor="middle"
    fill="#EEE3CF"
    font-family="Playfair Display, Didot, Bodoni 72, Georgia, serif"
    font-size="136"
    font-weight="800"
    letter-spacing="4">
    PROOF
  </text>
  <text x="425" y="405"
    text-anchor="middle"
    fill="#C8A46A"
    font-family="Montserrat, Inter, Helvetica, Arial, sans-serif"
    font-size="28"
    font-weight="500"
    letter-spacing="23">
    BARTENDING
  </text>
</svg>
