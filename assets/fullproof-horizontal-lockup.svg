<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 260" role="img" aria-labelledby="title desc">
  <title id="title">Full Proof Bartending horizontal lockup</title>
  <desc id="desc">Refined horizontal lockup with the FP seal and Full Proof Bartending wordmark.</desc>
  <rect width="1420" height="260" fill="none"/>
  <g transform="translate(78 52)">
    <circle cx="78" cy="78" r="68" fill="none" stroke="#C8A46A" stroke-width="4"/>
    <circle cx="78" cy="78" r="57" fill="none" stroke="#EEE3CF" stroke-width="1.6" opacity="0.86"/>
    <circle cx="78" cy="78" r="46" fill="none" stroke="#C8A46A" stroke-width="1" opacity="0.62"/>
    <text x="78" y="93"
